[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "binit-api"
version = "1.0.0"
description = "BinIt API - Civic Waste Intelligence & Route Optimization Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy>=2.0.35",
    "greenlet>=3.1.1",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "httpx>=0.27.2",
    "pillow>=10.4.0",
    "numpy>=2.1.1",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
binit-api = "app.main:app"

[tool.fastapi]
app = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]
